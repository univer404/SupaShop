    PRIME: {price: 1500, display: "<#2386D3>ᴘʀɪᴍᴇ ᴋᴇʏ", command: "primekeys give %player% 1 -s"}
    GOLD: {price: 1500, display: "<#E3B900>ɢᴏʟᴅ ᴋᴇʏ", command: "goldkeys give %player% 1 -s"}
    AMETHYST: {price: 4000, display: "<#6E3AAD>ᴀᴍᴇᴛʜʏѕᴛ ᴋᴇʏ", command: "amethystkeys give %player% 1 -s"}
    CRIMSON: {price: 2000, display: "<#C42119>ᴄʀɪᴍѕᴏɴ ᴋᴇʏ", command: "crimsonkeys give %player% 1 -s"}
  spawners:
    PIG: {price: 250, entity: pig, display: "<yellow>Pig Spawner"}
    COW: {price: 350, entity: cow, display: "<yellow>Cow Spawner"}
    ZOMBIE: {price: 400, entity: zombie, display: "<yellow>Zombie Spawner"}
    SPIDER: {price: 750, entity: spider, display: "<yellow>Spider Spawner"}
    SKELETON: {price: 500, entity: skeleton, display: "<yellow>Skeleton Spawner"}
    CREEPER: {price: 625, entity: creeper, display: "<yellow>Creeper Spawner"}
    ZOMBIFIED_PIGLIN: {price: 750, entity: zombified_piglin, display: "<yellow>Zombified Piglin Spawner"}
    BLAZE: {price: 1000, entity: blaze, display: "<yellow>Blaze Spawner"}
    IRON_GOLEM: {price: 1500, entity: iron_golem, display: "<yellow>Iron Golem Spawner"}
# Virtual-spawner integrations are command adapters because different plugins expose different APIs/commands.
# Add installed provider plugin names to detect; use the command format required by YOUR provider.
# %player% = buyer, %entity% = configured mob ID, %amount% = quantity.
spawner-provider:
  auto-detect: true
  # If multiple provider plugins are installed, first matching entry below wins.
  providers:
    - plugin: "ExcellentShop"
      commands:
        default: "ss give %player% %entity% %amount%"
    - plugin: "SilkSpawners"
      commands:
        default: "silkspawners give %player% %entity% %amount%"
    - plugin: "WildStacker"
      commands:
        default: "wildstacker give spawner %player% %entity% %amount%"
    - plugin: "EpicSpawners"
      commands:
        default: "epicspawners give %player% %entity% %amount%"
  # If auto-detect is false, this command is used for every spawner purchase.
  # Leave empty to disable spawner purchases until a provider is configured.
  fallback-command: ""
  # Per-mob command overrides; these override provider.commands.default.
  command-overrides: {}
gui:
  fill-empty-slots: false
  back-slot: 18
  confirm-slot: 15
  cancel-slot: 11
  item-slot: 13
